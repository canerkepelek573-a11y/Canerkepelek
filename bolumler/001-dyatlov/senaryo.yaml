# GERÇEK GİZEM · DOSYA #1 — DYATLOV GEÇİDİ
# Araştırma: docs/konular/dyatlov.md  ·  Kurallar: CLAUDE.md
# Yazım kuralları: sayılar rakamla yazılabilir (otomatik yazıya çevrilir); aralık (1–2) ve
# "2. Dünya" gibi büyük harfle devam eden sıra sayıları YAZIYLA yazılır.

bolum_no: 1
baslik: "Dyatlov Geçidi: Çadırı İçeriden Kesip Karanlığa Neden Kaçtılar?"
aciklama: |
  1959'un şubatında, Kuzey Urallarda dokuz deneyimli yürüyüşçü bir dağ yamacında kamp kurdu ve bir daha geri dönmedi. Çadırları içeriden kesilmişti; izler, eksi otuz derecede karanlık ormana uzanıyordu. Peki o gece Dyatlov Geçidi'nde gerçekte ne oldu?

  Gerçek Gizem'in ilk dosyasında bilinen gerçekleri, resmî açıklamaları, çığ teorisini, askerî test ve KGB iddialarını, Yeti söylentilerini ve yıllardır dolaşan efsaneleri tek tek masaya koyuyoruz. Karar sizin.
hashtagler: ["#DyatlovGeçidi", "#gizem", "#çözülemeyenolaylar", "#GerçekGizem"]
etiketler: ["Dyatlov Geçidi", "Dyatlov", "Dyatlov Pass", "Holat Siyahl", "Kholat Syakhl", "Ural Dağları",
            "çözülemeyen olaylar", "gizemli olaylar", "Sovyet gizemleri", "belgesel", "Gerçek Gizem"]
kaynaklar:
  - "Gaume & Puzrin (2021), Mechanisms of slab avalanche release and impact in the Dyatlov Pass incident in 1959, Communications Earth & Environment"
  - "Puzrin & Gaume (2022), Communications Earth & Environment"
  - "Rusya Başsavcılığı / Urallar savcılığı açıklamaları, 2019–2020 (TASS)"
  - "Dyatlov Geçidi ceza davası dosyası çevirileri — dyatlovpass.com"
  - "Donnie Eichar, Dead Mountain (2013)"
  - "The Moscow Times, History.com, Live Science, Snopes"

kapak:
  gorsel: {kaynak: commons, dosya: "File:Dyatlov Pass incident 02.jpg"}
  metin: "ÇADIR|İÇERİDEN KESİLDİ"
  odak: sag

son_kart: {kaynak: kart, ust: "Gerçek Gizem", baslik: "Bir Sonraki Dosyada Görüşmek Üzere", alt: "Abone olun, dosyalar açılmaya devam ediyor"}

