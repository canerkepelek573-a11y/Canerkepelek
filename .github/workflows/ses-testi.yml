name: Ses testi (Edge TTS)

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/ses_testi.py"
      - "ornekler/test_metni*.txt"
      - ".github/workflows/ses-testi.yml"

permissions:
  contents: write

concurrency:
  group: ses-testi
  cancel-in-progress: true

jobs:
  ses-testi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kütüphaneleri kur
        run: pip install edge-tts==7.3.1

      - name: Örnek sesleri üret
        run: python scripts/ses_testi.py

      - name: Sesleri depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add ornekler/
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "Ses testi örnekleri üretildi"
            git push
          fi
